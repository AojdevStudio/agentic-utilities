name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: [self-hosted, linux, dev-substrate]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # The action downloads a fixed filename; keep it in job-local temp.
          TMPDIR: ${{ runner.temp }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # The action's upload has no retention input, so the next step uploads the report.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
      - name: Preserve gitleaks report
        # Upload only this run's report. The self-hosted workspace can hold an older one.
        if: ${{ !cancelled() && steps.gitleaks.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: ignore
          retention-days: 7

  check:
    runs-on: [self-hosted, linux, dev-substrate]
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install job-scoped Bun
        env:
          BUN_JOB_DIR: ${{ runner.temp }}/bun
        run: |
          mkdir -p "$BUN_JOB_DIR"
          curl --fail --location --silent --show-error https://github.com/oven-sh/bun/releases/download/bun-v1.3.7/bun-linux-x64-baseline.zip --output "$BUN_JOB_DIR/bun.zip"
          unzip -q "$BUN_JOB_DIR/bun.zip" -d "$BUN_JOB_DIR"
          echo "$BUN_JOB_DIR/bun-linux-x64-baseline" >> "$GITHUB_PATH"
          "$BUN_JOB_DIR/bun-linux-x64-baseline/bun" --version
      - run: bun install --no-save --ignore-scripts
      - run: bun run check
      - run: bun run pack:dry
