[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "changelog-tool"
version = "1.0.0"
description = "A command-line changelog updater."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "gitpython>=3.1.0",
    "semver>=3.0.0",
    "click>=8.0.0",
    "colorama>=0.4.0",
]

[project.scripts]
changelog = "changelog_tool.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/changelog_tool"]
