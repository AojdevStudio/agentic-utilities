name: Hush
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Manual
    "CODE_SIGN_STYLE[sdk=iphonesimulator*]": Automatic
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  Hush:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes: ['**/*.md']
      - path: Resources
    info:
      path: .build/Info.plist
      properties:
        CFBundleDisplayName: Hush
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Unlock your Hush secrets with Face ID.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.aoj.hush
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ['$(inherited)', '-liconv', '-lsqlite3']
    dependencies:
      - framework: .build/HushBridge.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: LocalAuthentication.framework
  HushTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/CoreTests]
    dependencies:
      - target: Hush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.aoj.hush.tests
        GENERATE_INFOPLIST_FILE: YES
  HushUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests]
    dependencies:
      - target: Hush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.aoj.hush.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Hush:
    build:
      targets:
        Hush: all
        HushTests: [test]
        HushUITests: [test]
    test:
      targets: [HushTests, HushUITests]
      gatherCoverageData: true
    archive:
      config: Release
